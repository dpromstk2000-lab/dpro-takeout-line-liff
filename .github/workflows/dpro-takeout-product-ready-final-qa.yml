name: DPRO TAKEOUT Product Ready Final QA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dpro-takeout-product-ready-final-qa.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-takeout-product-ready-final-qa
  cancel-in-progress: false

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run TAKEOUT Product Ready final QA
        shell: bash
        env:
          TAKEOUT_SOURCE_SHA: ${{ github.sha }}
        run: |
          cat > "$GITHUB_WORKSPACE/dpro-takeout-final-qa.mjs" <<'DPRO_QA_JS'
          import fs from "node:fs";
          import { chromium } from "playwright";

          const API = "https://dpro-takeout-line-api.dpromstk2000.workers.dev";
          const APP = "https://dpromstk2000-lab.github.io/dpro-takeout-line-liff";
          const SITE = "https://dpromstk2000-lab.github.io/dpro-line-systems-site";
          const SHA = process.env.TAKEOUT_SOURCE_SHA || "unknown";

          const EXPECTED = {
            workerVersion: "TAKEOUT-PR3-CORS-ALLOWLIST-20260823",
            databaseVersion: "TAKEOUT-DB-PR2-20260823",
            frontendVersion: "TAKEOUT-18-FINAL-SYSTEM-CHECK-20260722",
            adapterVersion: "TAKEOUT-PRODUCT-READY-ADAPTER-2.0",
          };

          const result = {
            ok: false,
            sourceSha: SHA,
            startedAt: new Date().toISOString(),
            api: {},
            publicUrls: {},
            browser: [],
            technicalTerms: {},
            failures: [],
          };

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          async function fetchJson(url, options = {}, acceptable = [200]) {
            let last;
            for (let i = 0; i < 10; i++) {
              try {
                const response = await fetch(url, {
                  redirect: "follow",
                  cache: "no-store",
                  ...options,
                  headers: {
                    "Cache-Control": "no-cache",
                    ...(options.headers || {}),
                  },
                });
                const text = await response.text();
                let data = null;
                try { data = text ? JSON.parse(text) : null; } catch {}
                if (acceptable.includes(response.status)) {
                  return { response, text, data };
                }
                last = new Error(`HTTP ${response.status}: ${url} :: ${text.slice(0, 250)}`);
              } catch (e) {
                last = e;
              }
              await new Promise(r => setTimeout(r, 6000));
            }
            throw last || new Error(`fetch failed: ${url}`);
          }

          async function fetchPage(url) {
            const { response, text } = await fetchJson(url, {}, [200]);
            assert(text.length > 100, `Public page too small: ${url}`);
            return { status: response.status, finalUrl: response.url, bytes: Buffer.byteLength(text) };
          }

          async function runApiTests() {
            const health = await fetchJson(`${API}/api/health`, {}, [200]);
            assert(health.data?.ok === true, "health ok != true");
            for (const [key, value] of Object.entries(EXPECTED)) {
              assert(health.data?.[key] === value, `health ${key} mismatch`);
            }
            assert(health.data?.database?.boundary === "worker_service_role_only", "DB boundary mismatch");
            assert(health.data?.production_guard === true, "production_guard != true");
            assert(health.data?.adminAuthMode === "demo_only", "adminAuthMode mismatch");
            // DPRO fixed security baseline: explicit CORS allowlist, never wildcard.
            const corsAllowed = await fetchJson(`${API}/api/health`, {
              method: "OPTIONS",
              headers: {
                Origin: "https://dpromstk2000-lab.github.io",
                "Access-Control-Request-Method": "GET",
              },
            }, [204]);
            const allowedOrigin = corsAllowed.response.headers.get("access-control-allow-origin");
            assert(
              allowedOrigin === "https://dpromstk2000-lab.github.io",
              `CORS allowed origin mismatch: ${allowedOrigin}`
            );

            const corsDenied = await fetchJson(`${API}/api/health`, {
              method: "OPTIONS",
              headers: {
                Origin: "https://evil.example",
                "Access-Control-Request-Method": "GET",
              },
            }, [204]);
            const deniedOrigin = corsDenied.response.headers.get("access-control-allow-origin");
            assert(deniedOrigin !== "*", "CORS wildcard is forbidden");
            assert(deniedOrigin !== "https://evil.example", "Untrusted origin must not be allowed");
            result.api.cors = {
              ok: true,
              allowedOrigin,
              deniedOrigin,
              wildcardForbidden: true,
            };

            assert(health.data?.lineIdentityVerificationReady === true, "LINE verification not ready");
            assert(health.data?.lineIdentityMode === "server_verified_id_token", "LINE identity mode mismatch");
            assert(health.data?.lineCustomerBinding === "deferred_until_contract", "LINE binding contract changed");
            result.api.health = health.data;

            const prodAdmin = await fetchJson(
              `${API}/api/admin/system-check?shop_code=production_probe&admin_key=1234`,
              {},
              [503]
            );
            assert(prodAdmin.data?.ok === false, "production 1234 probe did not fail");
            assert(prodAdmin.data?.error === "ADMIN_AUTH_NOT_CONFIGURED", "production 1234 guard code mismatch");
            result.api.production1234Guard = {
              status: prodAdmin.response.status,
              error: prodAdmin.data?.error,
            };

            const forgedLine = await fetchJson(
              `${API}/api/member/orders`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  shop_code: "production_probe",
                  line_user_id: "U_FORGED_PR2_PROBE",
                }),
              },
              [401]
            );
            assert(forgedLine.data?.ok === false, "forged LINE probe did not fail");
            assert(forgedLine.data?.error === "LINE_ID_TOKEN_REQUIRED", "forged LINE guard code mismatch");
            result.api.forgedLineGuard = {
              status: forgedLine.response.status,
              error: forgedLine.data?.error,
            };

            const systemCheck = await fetchJson(
              `${API}/api/admin/system-check?shop_code=takeout_demo&admin_key=1234`,
              {},
              [200]
            );
            assert(systemCheck.data?.ok === true, "demo system-check failed");
            if (systemCheck.data?.summary) {
              const s = systemCheck.data.summary;
              if (Number.isFinite(s.automatic_check_count) && Number.isFinite(s.automatic_ok_count)) {
                assert(s.automatic_ok_count === s.automatic_check_count, "automatic system-check not all OK");
              }
            }
            result.api.systemCheck = systemCheck.data;

            let prepared = false;
            try {
              const prep = await fetchJson(
                `${API}/api/admin/demo-prepare?shop_code=takeout_demo&admin_key=1234`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ shop_code: "takeout_demo" }),
                },
                [200, 201]
              );
              assert(prep.data?.ok === true, "demo_prepare failed");
              prepared = true;
              result.api.demoPrepare = prep.data;
            } finally {
              if (prepared) {
                const reset = await fetchJson(
                  `${API}/api/admin/demo-reset?shop_code=takeout_demo&admin_key=1234`,
                  {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ shop_code: "takeout_demo" }),
                  },
                  [200]
                );
                assert(reset.data?.ok === true, "demo_reset failed");
                result.api.demoReset = reset.data;
              }
            }
          }

          async function runPublicUrlTests() {
            const urls = {
              demo: `${APP}/index.html?preview=1&v=pr2-final-${SHA}`,
              member: `${APP}/member.html?preview=1&v=pr2-final-${SHA}`,
              owner: `${APP}/owner.html?preview=1&v=pr2-final-${SHA}`,
              ownerIpad: `${APP}/owner-ipad.html?preview=1&v=pr2-final-${SHA}`,
              systemCheck: `${APP}/system-check.html?preview=1&v=pr2-final-${SHA}`,
              product: `${SITE}/systems/takeout.html?v=pr2-final-${SHA}`,
              lp: `${SITE}/lp-takeout.html?v=pr2-final-${SHA}`,
              a4Html: `${SITE}/flyer-takeout.html?v=pr2-final-${SHA}`,
              a4Pdf: `${SITE}/flyer-takeout.pdf?v=pr2-final-${SHA}`,
            };
            for (const [key, url] of Object.entries(urls)) {
              result.publicUrls[key] = await fetchPage(url);
            }
          }

          const userFacingPages = [
            ["customer", `${APP}/index.html?preview=1&v=pr2-browser-${SHA}`],
            ["member", `${APP}/member.html?preview=1&v=pr2-browser-${SHA}`],
            ["owner", `${APP}/owner.html?preview=1&v=pr2-browser-${SHA}`],
            ["ownerIpad", `${APP}/owner-ipad.html?preview=1&v=pr2-browser-${SHA}`],
          ];

          const viewports = [
            ["pc", 1440, 900],
            ["mobile390", 390, 844],
            ["mobile320", 320, 700],
            ["ipad", 1024, 1366],
          ];

          const bannedTechnicalTerms = [
            "SUPABASE_SERVICE_ROLE_KEY",
            "service_role",
            "X-Admin-Key",
            "ADMIN_KEY",
            "LINE_LOGIN_CHANNEL_ID",
            "postgres",
            "Row Level Security",
            " RLS ",
          ];

          async function runBrowserTests() {
            fs.mkdirSync("qa-artifacts/screenshots", { recursive: true });
            const browser = await chromium.launch({ headless: true });
            try {
              const browserMatrix = {
                pc: new Set(["customer", "member", "owner"]),
                mobile390: new Set(["customer", "member"]),
                mobile320: new Set(["customer", "member"]),
                ipad: new Set(["customer", "member", "ownerIpad"]),
              };

              for (const [vpName, width, height] of viewports) {
                for (const [pageName, url] of userFacingPages) {
                  if (!browserMatrix[vpName]?.has(pageName)) continue;
                  const context = await browser.newContext({ viewport: { width, height } });
                  const page = await context.newPage();
                  const pageErrors = [];
                  const consoleErrors = [];
                  page.on("pageerror", e => pageErrors.push(String(e)));
                  page.on("console", msg => {
                    if (msg.type() === "error") consoleErrors.push(msg.text());
                  });

                  const response = await page.goto(url, { waitUntil: "networkidle", timeout: 90000 });
                  assert(response && response.ok(), `Browser HTTP failed ${vpName}/${pageName}`);
                  await page.waitForTimeout(800);

                  const metrics = await page.evaluate(() => ({
                    innerWidth: window.innerWidth,
                    scrollWidth: document.documentElement.scrollWidth,
                    bodyWidth: document.body?.scrollWidth || 0,
                    text: document.body?.innerText || "",
                    title: document.title || "",
                  }));

                  const overflow = metrics.scrollWidth > metrics.innerWidth + 2 ||
                                   metrics.bodyWidth > metrics.innerWidth + 2;

                  const exposed = bannedTechnicalTerms.filter(term =>
                    metrics.text.toLowerCase().includes(term.toLowerCase())
                  );

                  assert(!overflow, `Horizontal overflow ${vpName}/${pageName}: ${metrics.scrollWidth} > ${metrics.innerWidth}`);
                  assert(pageErrors.length === 0, `pageerror ${vpName}/${pageName}: ${pageErrors.join(" | ")}`);
                  assert(exposed.length === 0, `technical term exposed ${vpName}/${pageName}: ${exposed.join(", ")}`);

                  const screenshot = `qa-artifacts/screenshots/${vpName}-${pageName}.png`;
                  await page.screenshot({ path: screenshot, fullPage: true });

                  result.browser.push({
                    viewport: vpName,
                    page: pageName,
                    url,
                    title: metrics.title,
                    horizontalOverflow: overflow,
                    pageErrors,
                    consoleErrorCount: consoleErrors.length,
                    exposedTechnicalTerms: exposed,
                    screenshot,
                  });

                  await context.close();
                }
              }
            } finally {
              await browser.close();
            }
          }

          try {
            await runApiTests();
            await runPublicUrlTests();
            await runBrowserTests();
            result.ok = true;
          } catch (e) {
            result.failures.push(String(e?.stack || e));
            result.ok = false;
            process.exitCode = 1;
          } finally {
            result.completedAt = new Date().toISOString();
            fs.mkdirSync("qa-artifacts", { recursive: true });
            fs.writeFileSync("qa-artifacts/final-qa-result.json", JSON.stringify(result, null, 2));

            const summary = [
              "# DPRO TAKEOUT Product Ready Final QA",
              "",
              `- Result: **${result.ok ? "PASS" : "FAIL"}**`,
              `- Source SHA: \`${result.sourceSha}\``,
              `- Worker: \`${result.api.health?.workerVersion || "unverified"}\``,
              `- Database: \`${result.api.health?.databaseVersion || "unverified"}\``,
              `- Frontend: \`${result.api.health?.frontendVersion || "unverified"}\``,
              `- Adapter: \`${result.api.health?.adapterVersion || "unverified"}\``,
              `- Browser checks: ${result.browser.length}`,
              `- Public URL checks: ${Object.keys(result.publicUrls).length}`,
              `- Production 1234 guard: ${result.api.production1234Guard?.error || "unverified"}`,
              `- Forged LINE guard: ${result.api.forgedLineGuard?.error || "unverified"}`,
              `- Demo prepare/reset: ${result.api.demoPrepare?.ok === true && result.api.demoReset?.ok === true ? "PASS" : "unverified"}`,
              "",
              ...(result.failures.length ? ["## Failures", ...result.failures.map(x => `- ${x}`)] : []),
            ].join("\n");

            fs.writeFileSync("qa-artifacts/final-qa-summary.md", summary + "\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
            console.log(`DPRO_FINAL_QA_RESULT=${result.ok ? "PASS" : "FAIL"}`);
            console.log(`DPRO_FINAL_QA_SOURCE_SHA=${result.sourceSha}`);
            console.log(JSON.stringify(result, null, 2));
          }
          DPRO_QA_JS

          set +e
          node "$GITHUB_WORKSPACE/dpro-takeout-final-qa.mjs"
          QA_EXIT=$?
          set -e

          mkdir -p qa-artifacts

          if [ ! -f qa-artifacts/final-qa-result.json ]; then
            cat > qa-artifacts/final-qa-result.json <<EOF
          {
            "ok": false,
            "sourceSha": "${GITHUB_SHA}",
            "failures": [
              "QA process exited before result creation. exit_code=${QA_EXIT}"
            ]
          }
          EOF
          fi

          if [ ! -f qa-artifacts/final-qa-summary.md ]; then
            {
              echo "# DPRO TAKEOUT Product Ready Final QA"
              echo
              echo "- Result: **FAIL**"
              echo "- Source SHA: \`${GITHUB_SHA}\`"
              echo "- QA process exit code: \`${QA_EXIT}\`"
            } > qa-artifacts/final-qa-summary.md
          fi

          echo "${QA_EXIT}" > qa-artifacts/qa-exit-code.txt

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpro-takeout-product-ready-final-qa
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish QA evidence to repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p product-ready-evidence/takeout
          cp qa-artifacts/final-qa-result.json product-ready-evidence/takeout/final-qa-result.json
          cp qa-artifacts/final-qa-summary.md product-ready-evidence/takeout/final-qa-summary.md
          cp qa-artifacts/qa-exit-code.txt product-ready-evidence/takeout/qa-exit-code.txt

          git config user.name "DPRO Product Ready QA"
          git config user.email "actions@users.noreply.github.com"

          git add product-ready-evidence/takeout/

          if git diff --cached --quiet; then
            echo "QA evidence already current."
          else
            git commit -m "TAKEOUT Product Ready: publish final QA evidence"
            git push origin HEAD:main
          fi

      - name: Enforce final QA result
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "qa-artifacts/final-qa-result.json";
          if (!fs.existsSync(path)) {
            console.error("Final QA result file is missing.");
            process.exit(1);
          }
          const result = JSON.parse(fs.readFileSync(path, "utf8"));
          if (result.ok !== true) {
            console.error("DPRO TAKEOUT Product Ready Final QA = FAIL");
            console.error(JSON.stringify(result.failures || [], null, 2));
            process.exit(1);
          }
          console.log("DPRO TAKEOUT Product Ready Final QA = PASS");
          NODE
