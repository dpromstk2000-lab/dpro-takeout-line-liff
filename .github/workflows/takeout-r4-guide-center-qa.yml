name: TAKEOUT Tutorial R4 Guide Center QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/takeout-r4-guide-center-qa.yml"
      - "guide-center.html"

permissions:
  contents: write

concurrency:
  group: takeout-tutorial-r4-guide-center-qa
  cancel-in-progress: false

jobs:
  r4-guide-center-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://dpromstk2000-lab.github.io/dpro-takeout-line-liff
      WORKFLOW_PATH: .github/workflows/takeout-r4-guide-center-qa.yml
      EVIDENCE_PATH: tutorial-r4-evidence/takeout-r4-guide-center-qa.json
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R3 PASS and R4 source
        shell: bash
        run: |
          set -euo pipefail
          test -s guide-center.html
          test -s tutorial-r3-evidence/takeout-r3-live-qa.json
          grep -q 'TAKEOUT-GUIDE-CENTER-R4-V1.0-20260829' guide-center.html
          grep -q '"pass": true' tutorial-r3-evidence/takeout-r3-live-qa.json
          grep -q '"businessMutation": 0' tutorial-r3-evidence/takeout-r3-live-qa.json
          test "$(grep -o 'id:\"TAKEOUT-FIRST10-[0-9][0-9]\"' guide-center.html | wc -l)" -eq 10

      - name: Wait for GitHub Pages to publish Guide Center
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsSL "$BASE_URL/guide-center.html?v=$GITHUB_SHA" | grep -q 'TAKEOUT-GUIDE-CENTER-R4-V1.0-20260829'; then
              exit 0
            fi
            sleep 10
          done
          echo "R4 Guide Center did not appear on GitHub Pages." >&2
          exit 1

      - name: Setup Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run R4 exact-width LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-r4-evidence
          cat > takeout-r4-guide-center-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const BASE=process.env.BASE_URL;
          const OUT=process.env.EVIDENCE_PATH;
          const viewports=[
            {name:'1440',width:1440,height:1000},
            {name:'1024',width:1024,height:768},
            {name:'390',width:390,height:844},
            {name:'320',width:320,height:720}
          ];
          const expectedRoutes=[
            ['/index.html','preview','1','#operationCard'],
            ['/index.html','preview','1','#pickupSection'],
            ['/index.html','preview','1','#catalogToolbar'],
            ['/index.html','preview','1','#productList [data-product-card]'],
            ['/member.html','preview','1','#profile'],
            ['/member.html','preview','1','#tabs [data-view="history"]'],
            ['/owner-ipad.html','preview','1','#metrics'],
            ['/owner-ipad.html','preview','1','#board .board-column'],
            ['/owner-products.html','preview','1','#summaryGrid'],
            ['/owner-settings.html','embed_demo','1','#section-rules .panel-head']
          ];
          const result={schema:'DPRO_TUTORIAL_TAKEOUT_R4_GUIDE_CENTER_QA_V1.0',sourceSha:process.env.GITHUB_SHA,baseUrl:BASE,first10Expected:10,viewports:[],stateAlignment:[],unsafeWriteAttempts:[],failures:[],businessMutation:0};
          const browser=await chromium.launch({headless:true});
          const setProgress=async(page,obj)=>page.evaluate(v=>localStorage.setItem('dpro_tutorial_takeout_v1_1',JSON.stringify(v)),obj);
          const clearProgress=async page=>page.evaluate(()=>localStorage.removeItem('dpro_tutorial_takeout_v1_1'));
          const snap=async page=>page.evaluate(()=>{
            const api=window.DPRO_TAKEOUT_GUIDE_CENTER;
            const a=document.querySelector('#guidePrimaryAction');
            const active=document.activeElement;
            const ar=active?.getBoundingClientRect?.();
            return {
              version:api?.version,first10Count:api?.first10Count,
              innerWidth,documentScrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth,
              cards:[...document.querySelectorAll('.first10-card')].map(x=>({step:x.dataset.step,route:x.dataset.route,target:x.dataset.target})),
              action:{mode:a?.dataset.mode,label:a?.textContent||'',href:a?.href||''},
              extra:[...document.querySelectorAll('.guide-link')].map(x=>x.getAttribute('href')),
              focus:{id:active?.id||'',tag:active?.tagName||'',rect:ar?{left:ar.left,top:ar.top,right:ar.right,bottom:ar.bottom,width:ar.width,height:ar.height}:null}
            };
          });
          for(const vp of viewports){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const unsafe=[],pageErrors=[],consoleErrors=[];
            await context.route('**/*',async route=>{
              const method=route.request().method();
              if(['POST','PUT','PATCH','DELETE'].includes(method)){
                const rec={viewport:vp.name,method,url:route.request().url()};unsafe.push(rec);result.unsafeWriteAttempts.push(rec);return route.abort('blockedbyclient');
              }
              return route.continue();
            });
            const page=await context.newPage();
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push({text:m.text(),location:m.location()});});
            await page.goto(`${BASE}/guide-center.html?qa=${Date.now()}`,{waitUntil:'domcontentloaded'});
            await clearProgress(page);await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.DPRO_TAKEOUT_GUIDE_CENTER?.first10Count===10);
            const start=await snap(page);
            if(start.first10Count!==10||start.cards.length!==10)result.failures.push(`${vp.name}: First10 count`);
            const routeOk=start.cards.every((c,i)=>c.route===`${expectedRoutes[i][0]}?${expectedRoutes[i][1]}=${expectedRoutes[i][2]}`&&c.target===expectedRoutes[i][3]);
            if(!routeOk)result.failures.push(`${vp.name}: Guide routes/targets mismatch`);
            const startUrl=new URL(start.action.href);
            if(start.action.mode!=='start'||!start.action.label.startsWith('Start')||startUrl.pathname!==`${new URL(BASE).pathname}/index.html`.replace('//','/')||startUrl.searchParams.get('preview')!=='1'||startUrl.searchParams.get('tutorial')!=='1')result.failures.push(`${vp.name}: Start alignment`);
            const overflowOk=vp.width>390||(start.documentScrollWidth<=start.innerWidth&&start.bodyScrollWidth<=start.innerWidth);
            if(!overflowOk)result.failures.push(`${vp.name}: mobile overflow`);
            await page.locator('body').focus();let reached=false;
            for(let i=0;i<30;i++){await page.keyboard.press('Tab');if(await page.evaluate(()=>document.activeElement?.id==='guidePrimaryAction')){reached=true;break;}}
            const focus=await snap(page);const fr=focus.focus.rect;const focusVisible=!!(reached&&fr&&fr.width>0&&fr.height>0&&fr.left>=-1&&fr.top>=-1&&fr.right<=vp.width+1&&fr.bottom<=vp.height+1);
            if(!focusVisible)result.failures.push(`${vp.name}: keyboard/focus`);
            const states=[
              {step:0,state:'active',path:'/index.html',flag:'preview'},
              {step:4,state:'active',path:'/member.html',flag:'preview'},
              {step:6,state:'active',path:'/owner-ipad.html',flag:'preview'},
              {step:8,state:'active',path:'/owner-products.html',flag:'preview'},
              {step:9,state:'active',path:'/owner-settings.html',flag:'embed_demo'}
            ];
            for(const st of states){await setProgress(page,{step:st.step,state:st.state,position:null});await page.reload({waitUntil:'domcontentloaded'});const s=await snap(page);const u=new URL(s.action.href);const ok=s.action.mode==='resume'&&s.action.label.startsWith('Resume')&&u.pathname.endsWith(st.path)&&u.searchParams.get(st.flag)==='1'&&u.searchParams.get('tutorial')==='1';result.stateAlignment.push({viewport:vp.name,state:st,action:s.action,ok});if(!ok)result.failures.push(`${vp.name}: Resume alignment step ${st.step+1}`);}
            for(const terminal of ['complete','skipped']){await setProgress(page,{step:9,state:terminal,position:null});await page.reload({waitUntil:'domcontentloaded'});const s=await snap(page);const ok=s.action.mode==='replay'&&s.action.label.startsWith('Replay');result.stateAlignment.push({viewport:vp.name,state:terminal,action:s.action,ok});if(!ok)result.failures.push(`${vp.name}: Replay alignment ${terminal}`);}
            if(vp.name==='390'){
              await setProgress(page,{step:9,state:'complete',position:null});await page.reload({waitUntil:'domcontentloaded'});await Promise.all([page.waitForURL(/index\.html\?preview=1&tutorial=1/,{waitUntil:'domcontentloaded'}),page.locator('#guidePrimaryAction').click()]);const replayState=await page.evaluate(()=>{try{return JSON.parse(localStorage.getItem('dpro_tutorial_takeout_v1_1')||'{}')}catch{return{}}});const replayUrl=new URL(page.url());const replayOk=Number(replayState.step)===0&&['new','active'].includes(replayState.state)&&replayUrl.pathname.endsWith('/index.html')&&replayUrl.searchParams.get('preview')==='1'&&replayUrl.searchParams.get('tutorial')==='1';result.stateAlignment.push({viewport:'390',state:'replay-click',action:{href:page.url()},storage:replayState,ok:replayOk});if(!replayOk)result.failures.push('390: Replay click did not reset STEP 1 / safe route');await page.goto(`${BASE}/guide-center.html?qa=return`,{waitUntil:'domcontentloaded'});
            }
            const extraOk=start.extra.some(x=>x.includes('demo-guide.html'))&&start.extra.some(x=>x.includes('system-check.html?preview=1'));
            if(!extraOk)result.failures.push(`${vp.name}: extra guide routes`);
            const guideConsole=consoleErrors.filter(e=>String(e.location?.url||'').includes('guide-center'));
            if(pageErrors.length)result.failures.push(`${vp.name}: pageerror ${pageErrors.join(' | ')}`);
            if(guideConsole.length)result.failures.push(`${vp.name}: Guide Center console error`);
            if(unsafe.length)result.failures.push(`${vp.name}: unsafe write attempts ${unsafe.length}`);
            result.viewports.push({viewport:vp,start,overflowOk,focusVisible,pageErrors,consoleErrors,unsafe,routeOk,extraOk});
            await context.close();
          }
          await browser.close();
          if(result.unsafeWriteAttempts.length)result.businessMutation='BLOCKED_UNSAFE_ATTEMPT_PRESENT';
          result.pass=result.failures.length===0&&result.unsafeWriteAttempts.length===0&&result.businessMutation===0;
          fs.writeFileSync(OUT,JSON.stringify(result,null,2));
          console.log(JSON.stringify({pass:result.pass,failures:result.failures,unsafe:result.unsafeWriteAttempts.length},null,2));
          if(!result.pass)process.exit(1);
          NODE
          node ./takeout-r4-guide-center-qa.mjs

      - name: Publish PASS evidence and self-remove QA workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f takeout-r4-guide-center-qa.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EVIDENCE_PATH"
          git rm "$WORKFLOW_PATH"
          git commit -m "TAKEOUT Tutorial R4 Guide Center QA PASS [skip ci]"
          git push origin main

      - name: Upload R4 QA evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takeout-r4-guide-center-qa-evidence
          path: tutorial-r4-evidence/takeout-r4-guide-center-qa.json
          if-no-files-found: warn
